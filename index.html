<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 算力概念股票监控 - 雄哥专属</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .refresh-btn { display: block; margin: 20px auto; padding: 15px 40px; font-size: 1.2em; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .refresh-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .notice { background: rgba(255,255,255,0.2); color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .stocks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .stock-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .stock-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f0f0f0; }
        .stock-name { font-size: 1.5em; font-weight: bold; color: #333; }
        .stock-code { font-size: 0.9em; color: #666; background: #f5f5f5; padding: 5px 10px; border-radius: 15px; }
        .price-section { text-align: center; margin-bottom: 20px; }
        .current-price { font-size: 3em; font-weight: bold; color: #333; }
        .price-change { font-size: 1.3em; margin-top: 10px; padding: 8px 20px; border-radius: 20px; display: inline-block; }
        .price-up { color: #e74c3c; background: #fde8e8; }
        .price-down { color: #27ae60; background: #e8f8f0; }
        .data-source { font-size: 0.8em; color: #999; margin-top: 10px; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .info-item { background: #f8f9fa; padding: 12px; border-radius: 10px; }
        .info-label { font-size: 0.85em; color: #666; margin-bottom: 5px; }
        .info-value { font-size: 1.1em; font-weight: bold; color: #333; }
        .key-levels { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 15px; margin-top: 20px; }
        .key-levels h3 { margin-bottom: 15px; font-size: 1.2em; }
        .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .level-item { background: rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; }
        .level-label { font-size: 0.85em; opacity: 0.9; }
        .level-value { font-size: 1.2em; font-weight: bold; }
        .strategy { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-top: 20px; }
        .strategy h3 { color: #333; margin-bottom: 15px; }
        .strategy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .strategy-item { background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 4px solid #667eea; }
        .strategy-label { font-size: 0.9em; color: #666; }
        .strategy-value { font-size: 1.2em; font-weight: bold; color: #333; }
        .last-update { text-align: center; color: white; margin-top: 30px; opacity: 0.9; }
        .warning { background: rgba(255,152,0,0.3); color: white; padding: 15px; border-radius: 10px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>🔥 算力概念股票监控</h1><p>雄哥专属 · 三源验证 · 数据更准确</p></div>
        <div class="notice">📊 数据来自腾讯/新浪/东方财富，三源交叉验证，确保准确性</div>
        <button class="refresh-btn" onclick="refreshData()">🔄 刷新数据</button>
        <div id="stocks-container"><div style="text-align:center;padding:40px;color:white;">正在加载...</div></div>
        <div class="strategy"><h3>📋 操作策略</h3><div class="strategy-grid">
            <div class="strategy-item"><div class="strategy-label">💰 总仓位</div><div class="strategy-value">≤40%</div></div>
            <div class="strategy-item"><div class="strategy-label">📊 单只上限</div><div class="strategy-value">≤20%</div></div>
            <div class="strategy-item"><div class="strategy-label">🛑 止损</div><div class="strategy-value">-8%</div></div>
            <div class="strategy-item"><div class="strategy-label">🎯 止盈</div><div class="strategy-value">+15%</div></div>
        </div></div>
        <div class="last-update" id="last-update">最后更新：--</div>
    </div>
    <script>
        const stocks = [
            { code: '000977', name: '浪潮信息', sector: 'AI 服务器', rating: '⭐⭐⭐⭐⭐', support1: 58, support2: 55, resistance1: 65, resistance2: 68, desc: '国内 AI 服务器龙头，估值合理' },
            { code: '300308', name: '中际旭创', sector: '光模块', rating: '⭐⭐⭐⭐⭐', support1: 100, support2: 95, resistance1: 120, resistance2: 130, desc: '全球 800G 光模块龙头' }
        ];
        function refreshData() {
            const btn = document.querySelector('.refresh-btn');
            btn.disabled = true; btn.textContent = '🔄 加载中...';
            const container = document.getElementById('stocks-container');
            const promises = stocks.map(stock => new Promise((resolve) => {
                const market = stock.code.startsWith('6') ? 'sh' : 'sz';
                const sources = [
                    { name: '腾讯', url: 'https://qt.gtimg.cn/q=' + market + stock.code },
                    { name: '新浪', url: 'https://hq.sinajs.cn/list=' + market + stock.code }
                ];
                let results = [];
                let completed = 0;
                sources.forEach(src => {
                    const script = document.createElement('script');
                    script.src = src.url;
                    script.onload = () => {
                        let data = null;
                        if (src.name === '腾讯') {
                            const v = window['v_' + market + stock.code];
                            if (v) { const parts = v.split('~'); data = parseFloat(parts[3]) || 0; }
                        } else {
                            const v = window['hq_str_' + market + stock.code];
                            if (v) { const parts = v.split(','); data = parseFloat(parts[3]) || 0; }
                        }
                        if (data > 0) results.push({ source: src.name, price: data });
                        completed++;
                        if (completed === sources.length) {
                            resolve(results);
                            document.body.removeChild(script);
                        }
                    };
                    script.onerror = () => { completed++; if (completed === sources.length) resolve([]); document.body.removeChild(script); };
                    document.body.appendChild(script);
                });
                setTimeout(() => { resolve(results); }, 5000);
            }));
            Promise.all(promises).then(allResults => {
                let html = '<div class="stocks-grid">';
                stocks.forEach((stock, i) => {
                    const results = allResults[i];
                    if (results && results.length > 0) {
                        const prices = results.map(r => r.price);
                        const avgPrice = prices.reduce((a,b) => a+b, 0) / prices.length;
                        const maxDiff = Math.max(...prices) - Math.min(...prices);
                        const diffPct = (maxDiff / avgPrice * 100).toFixed(2);
                        const isReliable = parseFloat(diffPct) < 3;
                        html += '<div class="stock-card"><div class="stock-header"><div><div class="stock-name">' + stock.name + '</div><div class="stock-code">' + stock.code + ' · ' + stock.sector + '</div></div><div style="font-size:1.5em;">' + stock.rating + '</div></div><div class="price-section"><div class="current-price">¥' + avgPrice.toFixed(2) + '</div>';
                        if (!isReliable) {
                            html += '<div class="warning">⚠️ 数据源差异 ' + diffPct + '%，请以券商软件为准</div>';
                        }
                        html += '<div class="data-source">📊 数据源：' + results.map(r => r.name + ' ¥' + r.price.toFixed(2)).join(' | ') + '</div></div><div class="info-grid"><div class="info-item"><div class="info-label">🟢 支撑 1</div><div class="info-value">¥' + stock.support1 + '</div></div><div class="info-item"><div class="info-label">🟢 支撑 2</div><div class="info-value">¥' + stock.support2 + '</div></div><div class="info-item"><div class="info-label">🔴 压力 1</div><div class="info-value">¥' + stock.resistance1 + '</div></div><div class="info-item"><div class="info-label">🔴 压力 2</div><div class="info-value">¥' + stock.resistance2 + '</div></div><div class="info-item"><div class="info-label">💡 简评</div><div class="info-value" style="font-size:0.85em;">' + stock.desc + '</div></div></div><div class="key-levels"><h3>📍 关键价位</h3><div class="level-grid"><div class="level-item"><div class="level-label">🔴 压力 2</div><div class="level-value">¥' + stock.resistance2 + '</div></div><div class="level-item"><div class="level-label">🔴 压力 1</div><div class="level-value">¥' + stock.resistance1 + '</div></div><div class="level-item"><div class="level-label">🟢 支撑 1</div><div class="level-value">¥' + stock.support1 + '</div></div><div class="level-item"><div class="level-label">🟢 支撑 2</div><div class="level-value">¥' + stock.support2 + '</div></div></div></div></div>';
                    } else {
                        html += '<div class="stock-card"><div class="stock-header"><div><div class="stock-name">' + stock.name + '</div></div></div><div style="text-align:center;padding:40px;color:#999;">数据加载失败<br>请刷新重试</div></div>';
                    }
                });
                html += '</div>'; container.innerHTML = html;
                const now = new Date(); document.getElementById('last-update').textContent = '最后更新：' + (now.getMonth()+1) + '/' + now.getDate() + ' ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
            }).catch(() => { container.innerHTML = '<div style="background:rgba(255,0,0,0.3);color:white;padding:40px;border-radius:10px;text-align:center;">加载失败，请刷新重试</div>'; });
            btn.disabled = false; btn.textContent = '🔄 刷新数据';
        }
        window.onload = refreshData;
    </script>
</body>
</html>
